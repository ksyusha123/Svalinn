---
- name: Install .NET SDK 10 on the Svalinn VM
  hosts: svalinn
  become: true
  gather_facts: false

  tasks:
    - name: Install .NET SDK 10
      ansible.builtin.apt:
        name: dotnet-sdk-10.0
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 180

    - name: List installed SDKs
      ansible.builtin.command: dotnet --list-sdks
      register: dotnet_sdks
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Verify .NET SDK 10
      ansible.builtin.assert:
        that:
          - dotnet_sdks.stdout is search('(?m)^10[.]0[.]')
        success_msg: .NET SDK 10 is installed.
      when: not ansible_check_mode

    - name: Show installed SDK versions
      ansible.builtin.debug:
        msg:
          sdks: "{{ dotnet_sdks.stdout_lines }}"
      when: not ansible_check_mode
